# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The oldest NeoForge players may run, written into mods.toml. Deliberately NOT neo_version:
# we build against a recent NeoForge but run on much older ones. 21.1.62 is the floor of
# GeckoLib 4.7.x, our one required dependency; our own code compiles and links identically
# back to 21.1.1. Re-run the linkage check in CLAUDE.md before bumping neo_version.
neo_version_range=[21.1.62,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=aeroweather
# The human-readable display name for the mod.
mod_name=AeroWeather
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.5.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.postmalloy.aeroweather

## Soft dependencies (M6 research spike — see CLAUDE.md "External references")
# Modrinth version IDs, not semver strings — resolved via the maven.modrinth Maven group.
# Sable is compileOnly+localRuntime (it's the actual API surface AeronauticsWindForceApplier
# uses); Create/Create Aeronautics are localRuntime only, for dev-client testing — our code
# never references their types directly, only Sable's.
sable_version=U678xqle
create_version=UjX6dr61
create_aeronautics_version=Vzp221Un
# Sable Companion's "common" module (loader-agnostic core, dev.ryanhcode.sable.companion.*)
# leaks into Sable's own public API signatures (e.g. SubLevel implements SubLevelAccess), so
# it's needed at compile time even though we never call it directly. Pinned to the exact
# version Sable 2.0.5 embeds via jarJar (see its META-INF/jarjar/metadata.json), not
# whatever's newest, to guarantee binary compatibility.
sable_companion_version=1.6.0
# MixinExtras, used by the Create windmill mixin's @ModifyExpressionValue. NeoForge already
# ships this at runtime via jarJar (see neoforge's own dependency graph), so it's compileOnly
# and must stay pinned to the version NeoForge bundles - do NOT jarJar it ourselves.
mixinextras_version=0.5.3
# Particle Rain (M12), localRuntime only - the mixin names it by string, so it's never a
# compile dependency. Modrinth version id for particlerain-4.0.0-beta.11+1.21.1-neoforge, the
# newest 1.21.1 build (every 1.21.1 build of it is a v4 alpha/beta). Client-only mod.
particle_rain_version=k32OBTlL
# Interactive Foliage (M16), localRuntime only - its mixins name it by string, so it's never a
# compile dependency, and it's an OPTIONAL dependency in mods.toml. Modrinth version id for
# mc2_interactivefoliage-2.0.0-neoforge+1.21.1, the first release with weather wind. It requires
# SWAY, which needs to be on the dev runtime too even though we never touch it.
interactive_foliage_version=szHc87G5
sway_version=uGTq42kW

## Required dependency (M10 wind vane)
# GeckoLib renders the wind vane's animated model. Unlike everything above, it's REQUIRED:
# players must install it alongside AeroWeather. Modrinth version id for
# geckolib-neoforge-1.21.1-4.9.2 (confirmed to resolve through the Modrinth maven).
geckolib_version=tPkJmim6
# The oldest GeckoLib players may run, written into mods.toml. 4.7.7 is the newest release that
# still supports NeoForge 21.1.62 (4.8+ needs 21.1.150); the vane links against it identically.
geckolib_version_range=[4.7.7,)
